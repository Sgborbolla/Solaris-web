<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Sol saliendo desde atrás (mitad visible) -->
  <circle cx="60" cy="35" r="22" fill="#f59e0b" opacity="0.9"/>
  
  <!-- Rayos del sol -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="5" x2="60" y2="12"/>
    <line x1="60" y1="58" x2="60" y2="65"/>
    <line x1="30" y1="35" x2="37" y2="35"/>
    <line x1="83" y1="35" x2="90" y2="35"/>
    <line x1="39" y1="14" x2="44" y2="19"/>
    <line x1="76" y1="51" x2="81" y2="56"/>
    <line x1="39" y1="56" x2="44" y2="51"/>
    <line x1="76" y1="19" x2="81" y2="14"/>
  </g>
  
  <!-- Panel solar inclinado con perspectiva -->
  <g transform="translate(60, 75) rotate(-15)">
    <!-- Base del panel (rectángulo inclinado) -->
    <rect x="-35" y="-20" width="70" height="40" rx="3" fill="#1e3a8a" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Líneas de celdas solares (grid) -->
    <line x1="-35" y1="-7" x2="35" y2="-7" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>
    <line x1="-35" y1="7" x2="35" y2="7" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>
    <line x1="-12" y1="-20" x2="-12" y2="20" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>
    <line x1="12" y1="-20" x2="12" y2="20" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Brillo/reflejo en el panel -->
    <rect x="-33" y="-18" width="66" height="12" rx="2" fill="white" opacity="0.15"/>
  </g>
  
  <!-- Soporte/base del panel -->
  <rect x="55" y="95" width="10" height="15" rx="2" fill="#475569"/>
  <rect x="45" y="108" width="30" height="4" rx="2" fill="#334155"/>
</svg>
